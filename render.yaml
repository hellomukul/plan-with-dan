# Render Blueprint: one web service. FastAPI serves the API and the built React app,
# so login cookies are same-origin. Connect the repo in Render → New → Blueprint.
services:
  - type: web
    name: plan-with-dan
    runtime: python
    plan: free
    region: ohio         # same AWS region as the Neon database (us-east-2), so each query is ~1 ms, not ~70 ms
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: PORTKEY_API_KEY
        sync: false        # paste your key in the Render dashboard; never commit it
      - key: MODEL_NAME
        value: gpt-6-luna
      - key: SECURE_COOKIES
        value: "true"
      - key: DATABASE_URL
        sync: false        # REQUIRED for real users: a Neon Postgres URL. Render's disk is wiped on every deploy/restart,
                           # so without this every account and plan is lost. The app logs a warning if it's missing.
      # "Continue with Google / Microsoft" (step-by-step: docs/oauth_setup.md). Leave a pair empty and that
      # button is simply hidden; email + password keeps working.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false        # secret: paste in the dashboard only
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false        # secret: paste in the dashboard only
      - key: PUBLIC_BASE_URL
        sync: false        # e.g. https://plan-with-dan.onrender.com (no trailing slash); pins the OAuth redirect URIs
